version: "0.2.0"
description: >-
  TI INA226 bidirectional current, voltage and power monitor: calibration
  computed from the sense resistor actually fitted, part identification before
  anything is written, and the full measurement set. Returns facts rather than
  formatted text, so the caller decides how to report them.
url: https://github.com/benvonhandorf/esp_components/tree/main/ina226
repository: https://github.com/benvonhandorf/esp_components.git
issues: https://github.com/benvonhandorf/esp_components/issues
tags:
  - current-sense
  - power-monitor
  - ina226
  - i2c
  - sensor
dependencies:
  # i2c_master_dev_handle_t and the i2c_master API it belongs to.
  idf: ">=5.3"
