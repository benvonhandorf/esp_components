version: "0.2.1"
description: >-
  Browser transport for the cli shell: a single-page terminal served over HTTP
  with command lines carried on a WebSocket. Commands from a browser join the
  same executor queue the serial reader feeds, and all output is mirrored to
  every connected browser, so serial and web see the same session. Starts its
  own HTTP server or registers on one you already have.
url: https://github.com/benvonhandorf/esp_components/tree/main/cli_web
repository: https://github.com/benvonhandorf/esp_components.git
issues: https://github.com/benvonhandorf/esp_components/issues
tags:
  - console
  - cli
  - websocket
  - http
dependencies:
  idf: ">=5.0"
  # the shell this is a transport for
  cli:
    git: https://github.com/benvonhandorf/esp_components.git
    path: cli
    version: cli-v0.2.0
  # output mirrored to every connected browser
  diag:
    git: https://github.com/benvonhandorf/esp_components.git
    path: diag
    version: diag-v0.1.0
