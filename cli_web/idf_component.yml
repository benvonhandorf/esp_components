version: "0.1.0"
description: >-
  Browser transport for the cli shell: a single-page terminal served over HTTP
  with command lines carried on a WebSocket. Commands from a browser join the
  same executor queue the serial reader feeds, and all output is mirrored to
  every connected browser, so serial and web see the same session. Starts its
  own HTTP server or registers on one you already have.
url: https://github.com/benvonhandorf/esp_components
repository: git://github.com/benvonhandorf/esp_components.git
issues: https://github.com/benvonhandorf/esp_components/issues
tags:
  - console
  - cli
  - websocket
  - http
dependencies:
  idf: ">=5.0"
  # Inter-component dependencies are declared here at publish time, once this
  # repository is pushed and per-component tags exist -- for a git dependency the
  # component manager treats `version` as a git ref, so it cannot resolve against
  # tags that have not been created. Until then the build is driven by the CMake
  # REQUIRES/PRIV_REQUIRES in CMakeLists.txt, which is what actually links.
  # See "Publishing" in ../AGENTS.md.
