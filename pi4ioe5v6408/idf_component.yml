version: "0.1.0"
description: >-
  Diodes PI4IOE5V6408 8-bit I/O expander with configurable pulls, interrupt-on-change and 5 V tolerant inputs. Pins are numbered, not named: what each one drives is a fact about the board.
  Returns facts rather than formatted text, so the caller decides how to report
  them.
url: https://github.com/benvonhandorf/esp_components/tree/main/pi4ioe5v6408
repository: https://github.com/benvonhandorf/esp_components.git
issues: https://github.com/benvonhandorf/esp_components/issues
tags:
  - gpio
  - io-expander
  - pi4ioe5v6408
  - i2c
dependencies:
  # i2c_master_dev_handle_t and the i2c_master API it belongs to.
  idf: ">=5.3"
