version: "0.2.0"
description: >-
  HTTP management interface: one server, routes registered as data rather than
  through a weak symbol, and optional Basic authentication decided per route.
  Listens from start(), with no address needed, so the handle is available to
  share from boot; reachable over the device's own access point too. Refuses to
  start with authentication enabled and no password.
url: https://github.com/benvonhandorf/esp_components/tree/main/http_server
repository: https://github.com/benvonhandorf/esp_components.git
issues: https://github.com/benvonhandorf/esp_components/issues
tags:
  - http
  - web
  - networking
dependencies:
  idf: ">=5.0"
  # the generated config type is public API
  js2c:
    git: https://github.com/benvonhandorf/esp_components.git
    path: js2c
    version: js2c-v0.1.0
  # starts listening when the link comes up
  net_events:
    git: https://github.com/benvonhandorf/esp_components.git
    path: net_events
    version: net_events-v0.1.0
