version: "0.1.0"
description: >-
  A command shell for bring-up and field diagnostics, reachable over serial and
  over a browser at the same time. Commands are addressed as "<group> <command>";
  groups are a naming and help device with no navigation state, so there is no
  current menu to shadow a command or capture a self-composed line. One executor
  task runs every command, so command modules need no locking of their own.
url: https://github.com/benvonhandorf/esp_components/tree/main/cli
repository: https://github.com/benvonhandorf/esp_components.git
issues: https://github.com/benvonhandorf/esp_components/issues
tags:
  - console
  - cli
  - shell
  - diagnostics
dependencies:
  idf: ">=5.0"
  # Inter-component dependencies are declared here at publish time, once this
  # repository is pushed and per-component tags exist -- for a git dependency the
  # component manager treats `version` as a git ref, so it cannot resolve against
  # tags that have not been created. Until then the build is driven by the CMake
  # REQUIRES/PRIV_REQUIRES in CMakeLists.txt, which is what actually links.
  # See "Publishing" in ../AGENTS.md.
