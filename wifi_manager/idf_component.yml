version: "0.2.0"
description: >-
  WiFi station and access point with prioritised known networks, scanning,
  connection timeouts, reconnect backoff and an optional reachability check.
  Publishes link state as events rather than calling into the services that care,
  so it depends on nothing that runs over it.
url: https://github.com/benvonhandorf/esp_components/tree/main/wifi_manager
repository: https://github.com/benvonhandorf/esp_components.git
issues: https://github.com/benvonhandorf/esp_components/issues
tags:
  - wifi
  - networking
dependencies:
  idf: ">=5.0"
  # the generated config type is public API
  js2c:
    git: https://github.com/benvonhandorf/esp_components.git
    path: js2c
    version: js2c-v0.1.0
  # link state is published, not called out to
  net_events:
    git: https://github.com/benvonhandorf/esp_components.git
    path: net_events
    version: net_events-v0.1.0
