version: "0.1.0"
description: >-
  Sensirion SHT4x humidity and temperature sensor: measurement at all three
  repeatabilities, the six heater settings, serial number and soft reset, with
  CRC checking that says which word failed. Returns facts rather than formatted
  text, so the caller decides how to report them.
url: https://github.com/benvonhandorf/esp_components/tree/main/sht4x
repository: https://github.com/benvonhandorf/esp_components.git
issues: https://github.com/benvonhandorf/esp_components/issues
tags:
  - humidity
  - temperature
  - sht4x
  - sht40
  - i2c
  - sensor
dependencies:
  # i2c_master_dev_handle_t and the i2c_master API it belongs to.
  idf: ">=5.3"
